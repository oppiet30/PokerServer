name: Build and test
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: poker_test
          MARIADB_USER: poker
          MARIADB_PASSWORD: test-only-password
          MARIADB_ROOT_PASSWORD: test-only-root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and HSQL persistence tests
        run: mvn -B -ntp verify
      - name: MariaDB persistence and poker tests
        run: >-
          mvn -B -ntp verify
          -Dpoker.test.driver=org.mariadb.jdbc.Driver
          -Dpoker.test.url=jdbc:mariadb://localhost:3306/poker_test
          -Dpoker.test.user=poker
          -Dpoker.test.password=test-only-password
          -Dpoker.test.dialect=org.hibernate.dialect.MariaDBDialect
      - name: GlassFish 8 deployment smoke test
        env:
          POKER_DB_URL: jdbc:mariadb://localhost:3306/poker_test
          POKER_DB_USER: poker
          POKER_DB_PASSWORD: test-only-password
          POKER_DB_DDL: update
        run: |
          bash scripts/glassfish-smoke-test.sh
